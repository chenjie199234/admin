apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-deployment
  namespace: <PROJECT>-<GROUP>
  labels:
    app: admin
spec:
  replicas: 2
  minReadySeconds: 5
  progressDeadlineSeconds: 300
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: admin
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: admin
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - admin
              topologyKey: kubernetes.io/hostname
      containers:
        - name: admin
          image: <IMAGE>
          imagePullPolicy: IfNotPresent
          ports:
            - name: web
              protocol: TCP
              containerPort: 8000
            - name: crpc
              protocol: TCP
              containerPort: 9000
            - name: grpc
              protocol: TCP
              containerPort: 10000
          resources:
            limits:
              memory: "4096Mi"
              cpu: "4000m"
            requests:
              memory: "256Mi"
              cpu: "1000m"
          env:
            - name: HOSTIP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: GROUP
              value: <GROUP>
            - name: PROJECT
              value: <PROJECT>
            - name: TRACE
              value: <TRACE>
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: <OTEL_EXPORTER_OTLP_TRACES_ENDPOINT>
            - name: METRIC
              value: <METRIC>
            - name: OTEL_EXPORTER_OTLP_METRICS_ENDPOINT
              value: <OTEL_EXPORTER_OTLP_METRICS_ENDPOINT>
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: <OTEL_EXPORTER_OTLP_ENDPOINT>
            - name: DEPLOY_ENV
              value: <DEPLOY_ENV>
            - name: RUN_ENV
              value: <RUN_ENV>
            - name: CONFIG_SECRET
              value: <CONFIG_SECRET>
          startupProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 0
            timeoutSeconds: 1
            periodSeconds: 2
            successThreshold: 1
            failureThreshold: 10
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 3
            timeoutSeconds: 1
            periodSeconds: 3
            successThreshold: 1
            failureThreshold: 3
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: admin-hpa
  namespace: <PROJECT>-<GROUP>
  labels:
    app: admin
spec:
  scaleTargetRef:   
    apiVersion: apps/v1
    kind: Deployment  
    name: admin-deployment
  maxReplicas: 10
  minReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: memory
        target:
          # the Utilization is based on the requests not the limits
          # so we use AverageValue and set the value close to the limits
          type: AverageValue
          averageValue: 3500Mi
    - type: Resource
      resource:
        name: cpu
        target:
          # the Utilization is based on the requests not the limits
          # so we use AverageValue and set the value close to the limits
          type: AverageValue
          averageValue: 3400m
---
apiVersion: v1
kind: Service
metadata:
  name: admin-service-headless
  namespace: <PROJECT>-<GROUP>
  labels:
    app: admin
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: crpc
      protocol: TCP
      port: 9000
    - name: grpc
      protocol: TCP
      port: 10000
  selector:
    app: admin
---
apiVersion: v1
kind: Service
metadata:
  name: admin-service
  namespace: <PROJECT>-<GROUP>
  labels:
    app: admin
spec:
  type: ClusterIP
  ports:
    - name: web
      protocol: TCP
      port: 8000
  selector:
    app: admin
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: admin-route
  namespace: <PROJECT>-<GROUP>
  labels:
    app: admin
spec:
  parentRefs:
    - name: <PROJECT>-<GROUP>-gateway
      namespace: <PROJECT>-<GROUP>
  hostnames:
    - "<HOST>"
  rules: 
    - matches:
      - path:
          type: RegularExpression
          value: "^/admin\\.[^/]+/[^/]+$"
      backendRefs:
        - name: admin-service
          port: 8000
