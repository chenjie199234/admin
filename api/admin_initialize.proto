edition = "2024";

package admin;//this is the proto package name,all proto in this project must use this name as the proto package name
//this is the golang's package name,all proto in this project must use this name as the golang's package name
option go_package="github.com/chenjie199234/admin/api;api";
//all other imports should put before this line
//all pbex options on response will not be checked automatically
//https://github.com/chenjie199234/Corelib/blob/main/pbex/pbex.proto
import option "pbex/pbex.proto";

//this is the proto file for initialize service
service Initialize{
	//for web server the response's 'Content-Type' always be 'application/json' when response code is not 200
