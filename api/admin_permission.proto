	rpc GetUserPermission(GetUserPermissionReq)returns(GetUserPermissionResp){
		option (pbex.method)="post";
		option (pbex.web_midwares)="accesskey";
	}

	rpc UpdateUserPermission(UpdateUserPermissionReq)returns(UpdateUserPermissionResp){
		option (pbex.method)="post";
		option (pbex.web_midwares)="token";
	}

	rpc UpdateRolePermission(UpdateRolePermissionReq)returns(UpdateRolePermissionResp){
		option (pbex.method)="post";
		option (pbex.web_midwares)="token";
	}

	rpc AddNode(AddNodeReq)returns(AddNodeResp){
		option (pbex.method)="post";
		option (pbex.web_midwares)="token";
	}

	rpc UpdateNode(UpdateNodeReq)returns(UpdateNodeResp){
		option (pbex.method)="post";
		option (pbex.web_midwares)="token";
	}

	rpc MoveNode(MoveNodeReq)returns(MoveNodeResp){
		option (pbex.method)="post";
		option (pbex.web_midwares)="token";
	}

	rpc DelNode(DelNodeReq)returns(DelNodeResp){
		option (pbex.method)="post";
		option (pbex.web_midwares)="token";
	}

	rpc ListUserNode(ListUserNodeReq)returns(ListUserNodeResp){
		option (pbex.method)="post";
		option (pbex.web_midwares)="token";
	}

	rpc ListRoleNode(ListRoleNodeReq)returns(ListRoleNodeResp){
		option (pbex.method)="post";
		option (pbex.web_midwares)="token";
	}

	rpc ListProjectNode(ListProjectNodeReq)returns(ListProjectNodeResp){
		option (pbex.method)="post";
		option (pbex.web_midwares)="token";
	}
