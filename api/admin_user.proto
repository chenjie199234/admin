	rpc GetOauth2(GetOauth2Req)returns(GetOauth2Resp){
		option (pbex.method)="post";
	}

	rpc UserLogin(UserLoginReq)returns(UserLoginResp){
		option (pbex.method)="post";
	}

	rpc LoginInfo(LoginInfoReq)returns(LoginInfoResp){
		option (pbex.method)="post";
		option (pbex.web_midwares)="token";
	}

	rpc InviteProject(InviteProjectReq)returns(InviteProjectResp){
		option (pbex.method)="post";
		option (pbex.web_midwares)="token";
	}

	rpc KickProject(KickProjectReq)returns(KickProjectResp){
		option (pbex.method)="post";
		option (pbex.web_midwares)="token";
	}

	rpc SearchUsers(SearchUsersReq)returns(SearchUsersResp){
		option (pbex.method)="post";
		option (pbex.web_midwares)="token";
	}

	rpc CreateRole(CreateRoleReq)returns(CreateRoleResp){
		option (pbex.method)="post";
		option (pbex.web_midwares)="token";
	}

	rpc SearchRoles(SearchRolesReq)returns(SearchRolesResp){
		option (pbex.method)="post";
		option (pbex.web_midwares)="token";
	}

	rpc UpdateRole(UpdateRoleReq)returns(UpdateRoleResp){
		option (pbex.method)="post";
		option (pbex.web_midwares)="token";
	}

	rpc DelRoles(DelRolesReq)returns(DelRolesResp){
		option (pbex.method)="post";
		option (pbex.web_midwares)="token";
	}

	rpc AddUserRole(AddUserRoleReq)returns(AddUserRoleResp){
		option (pbex.method)="post";
		option (pbex.web_midwares)="token";
	}

	rpc DelUserRole(DelUserRoleReq)returns(DelUserRoleResp){
		option (pbex.method)="post";
		option (pbex.web_midwares)="token";
	}
}

//req can be set with pbex extentions
//message ExampleReq{
	//int64 example_for_extentions=1[(pbex.int_gt)=1,(pbex.int_lt)=100];
//}
//resp's pbex extentions will be ignore
//message ExampleResp{
	//int64 example_resp=1;
//}

message GetOauth2Req{
	string src_type=1[(pbex.string_bytes_in)="DingDing",(pbex.string_bytes_in)="FeiShu",(pbex.string_bytes_in)="WXWork"];
}
message GetOauth2Resp{
	string url=1;
}

message UserInfo {
	string user_id=1;
	string feishu_user_name=2;
	string dingding_user_name=3;
	string wxwork_user_name=4;
	uint32 ctime=5;//timestamp,uint seconds
	repeated ProjectRoles project_roles=6;
}
message ProjectRoles{
	repeated uint32 project_id=1;
	repeated string roles=2;
}

message UserLoginReq {
	string src_type=1[(pbex.string_bytes_in)="DingDing",(pbex.string_bytes_in)="FeiShu",(pbex.string_bytes_in)="WXWork"];
	string code=2[(pbex.string_bytes_len_not_eq)=0];
}
message UserLoginResp {
	string token=1;
}
message LoginInfoReq{
}
message LoginInfoResp{
	UserInfo user=1;
}
message InviteProjectReq{
	//first element must be 0
	repeated uint32 project_id=1[(pbex.map_repeated_len_eq)=2];
	string user_id=2[(pbex.string_bytes_len_not_eq)=0];
}
message InviteProjectResp{
}
message KickProjectReq{
	//first element must be 0
	repeated uint32 project_id=1[(pbex.map_repeated_len_eq)=2];
	string user_id=2[(pbex.string_bytes_len_not_eq)=0];
}
message KickProjectResp{
}
message SearchUsersReq {
	//first element must be 0
	repeated uint32 project_id=1[(pbex.map_repeated_len_eq)=2];
	string user_name=2;//fuzzy search
	//true - search users in the project,this require operator has read permission on this project's user control node
	//false - search all users(include users not in this project),this require operator has admin permission on this project's user control node
	bool only_project=3;
	uint32 page=4;//if page is 0,means return all result
}
message SearchUsersResp {
	repeated UserInfo users=1;//key userid,value userinfo(only contains the required project's roles)
	uint32 page=2;
	uint32 pagesize=3;
	uint32 totalsize=4;
}
message CreateRoleReq {
	//first element must be 0
	repeated uint32 project_id=1[(pbex.map_repeated_len_eq)=2];
	string role_name=2[(pbex.string_bytes_len_not_eq)=0];
	string comment=3;
}
message CreateRoleResp {
}
message SearchRolesReq {
	//first element must be 0
	repeated uint32 project_id=1[(pbex.map_repeated_len_eq)=2];
	string role_name=2;//fuzzy search
	uint32 page=3;//page starts from 1,if page is 0,means return all result
}

message RoleInfo {
	repeated uint32 project_id=1;
	string role_name=2;
	string comment=3;
	uint32 ctime=4;
}
message SearchRolesResp {
	repeated RoleInfo roles=1;
	uint32 page=2;
	uint32 pagesize=3;
	uint32 totalsize=4;
}
message UpdateRoleReq {
	//first element must be 0
	repeated uint32 project_id=1[(pbex.map_repeated_len_eq)=2];
	string role_name=2[(pbex.string_bytes_len_not_eq)=0];
	string new_comment=3;//if didn't change,set this with the old value
}
message UpdateRoleResp {
}
message DelRolesReq {
	//first element must be 0
	repeated uint32 project_id=1[(pbex.map_repeated_len_eq)=2];
	repeated string role_names=2[(pbex.map_repeated_len_not_eq)=0,(pbex.string_bytes_len_not_eq)=0];
}
message DelRolesResp {
}
message AddUserRoleReq {
	//first element must be 0
	repeated uint32 project_id=1[(pbex.map_repeated_len_eq)=2];
	string user_id=2[(pbex.string_bytes_len_not_eq)=0];
	string role_name=3[(pbex.string_bytes_len_not_eq)=0];
}
message AddUserRoleResp {
}
message DelUserRoleReq {
	//first element must be 0
	repeated uint32 project_id=1[(pbex.map_repeated_len_eq)=2];
	string user_id=2[(pbex.string_bytes_len_not_eq)=0];
	string role_name=3[(pbex.string_bytes_len_not_eq)=0];
}
message DelUserRoleResp {
}
