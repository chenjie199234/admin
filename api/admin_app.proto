	rpc GetApp(GetAppReq)returns(GetAppResp){
		option (pbex.method)="post";
		option (pbex.web_midwares)="token";
	}

	//app

	rpc SetApp(SetAppReq)returns(SetAppResp){
		option (pbex.method)="post";
		option (pbex.web_midwares)="token";
	}
	rpc DelApp(DelAppReq)returns(DelAppResp){
		option (pbex.method)="post";
		option (pbex.web_midwares)="token";
	}
	rpc UpdateAppSecret(UpdateAppSecretReq)returns(UpdateAppSecretResp){
		option (pbex.method)="post";
		option (pbex.web_midwares)="token";
	}
	rpc DelKey(DelKeyReq)returns(DelKeyResp){
		option (pbex.method)="post";
		option (pbex.web_midwares)="token";
	}
	rpc GetKeyConfig(GetKeyConfigReq)returns(GetKeyConfigResp){
		option (pbex.method)="post";
		option (pbex.web_midwares)="token";
	}
	rpc SetKeyConfig(SetKeyConfigReq)returns(SetKeyConfigResp){
		option (pbex.method)="post";
		option (pbex.web_midwares)="token";
	}
	rpc Rollback(RollbackReq)returns(RollbackResp){
