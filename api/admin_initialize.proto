	//	option (pbex.web_midwares)="c";
	//	option (pbex.web_midwares)="a";//this function on web protocol has 3 midwares,it's order is b,c,a
	//	option (pbex.crpc_midwares)="b";
	//	option (pbex.crpc_midwares)="c";
	//	option (pbex.crpc_midwares)="a";//this function on crpc protocol has 3 midwares,it's order is b,c,a
	//	option (pbex.cgrpc_midwares)="b";
	//	option (pbex.cgrpc_midwares)="c";
	//	option (pbex.cgrpc_midwares)="a";//this function on grpc protocol has 3 midwares,it's order is b,c,a
	//}

	//you can use the stream mode for both client and server on crpc and grpc
	//rpc ExampleStreamCrpcGrpc(stream ExampleReq)returns(stream ExampleResp){
	//	option (pbex.method)="crpc";
	//	option (pbex.method)="grpc";//can be set to one of (get,delete,post,put,patch) or crpc or grpc
	//	option (pbex.crpc_midwares)="b";
	//	option (pbex.crpc_midwares)="c";
	//	option (pbex.crpc_midwares)="a";//this function on crpc protocol has 3 midwares,it's order is b,c,a
	//	option (pbex.cgrpc_midwares)="b";
	//	option (pbex.cgrpc_midwares)="c";
	//	option (pbex.cgrpc_midwares)="a";//this function on grpc protocol has 3 midwares,it's order is b,c,a
	//}

	//1.for web server,you can only use the stream mode on server(Server Sent Events,SSE mode)
	//2.unfortunate,javascript's 'EventSource' can't set header and must use GET,so you need to use 'fetch' to simulate 'EventSource' if need to set header or use other method like POST
	//3.response's 'Content-Type' always be 'application/json' when code is not 200 and always be 'text/event-stream' when code is 200.
	//4.only event:message(default) and event:error will be used,and event:error always be the last,after error,the connection will be closed
	//rpc ExampleStreamWeb(ExampleReq)returns(stream ExampleResp){
	//	option (pbex.method)="get";
	//	option (pbex.web_midwares)="b";
	//	option (pbex.web_midwares)="c";
	//	option (pbex.web_midwares)="a";//this function on web protocol has 3 midwares,it's order is b,c,a
	//}

	//初始化状态
	rpc InitStatus(InitStatusReq)returns(InitStatusResp){
		option (pbex.method)="post";
	}
	//初始化
	rpc Init(InitReq)returns(InitResp){
		option (pbex.method)="post";
		option (pbex.web_midwares)="accesskey";
	}
	//登录
	rpc RootLogin(RootLoginReq)returns(RootLoginResp){
		option (pbex.method)="post";
	}
	//更新密码
	rpc UpdateRootPassword(UpdateRootPasswordReq)returns(UpdateRootPasswordResp){
		option (pbex.method)="post";
		option (pbex.web_midwares)="token";
	}
	//创建项目
	rpc CreateProject(CreateProjectReq)returns(CreateProjectResp){
		option (pbex.method)="post";
		option (pbex.web_midwares)="token";
	}
	//更新项目
	rpc UpdateProject(UpdateProjectReq)returns(UpdateProjectResp){
		option (pbex.method)="post";
		option (pbex.web_midwares)="token";
	}
	//获取项目列表
	rpc ListProject(ListProjectReq)returns(ListProjectResp){
		option (pbex.method)="post";
		option (pbex.web_midwares)="token";
	}
	//删除项目
	rpc DeleteProject(DeleteProjectReq)returns(DeleteProjectResp){
		option (pbex.method)="post";
		option (pbex.web_midwares)="token";
	}
}

//req can be set with pbex extentions
//message ExampleReq{
	//int64 example_for_extentions=1[(pbex.int_gt)=1,(pbex.int_lt)=100];
//}
//resp's pbex extentions will be ignore
//message ExampleResp{
	//int64 example_resp=1;
//}

message InitStatusReq{
}
message InitStatusResp{
	bool status=1;//true-already inited,false-not inited
}
message InitReq{
	string password=1[(pbex.string_bytes_len_gte)=10,(pbex.string_bytes_len_lte)=32];
}
message InitResp{

}
message RootLoginReq{
	string password=1[(pbex.string_bytes_len_gte)=10,(pbex.string_bytes_len_lte)=32];
}
message RootLoginResp{
	string token=1;
}
message UpdateRootPasswordReq{
	string old_password=1[(pbex.string_bytes_len_gte)=10,(pbex.string_bytes_len_lte)=32];
	string new_password=2[(pbex.string_bytes_len_gte)=10,(pbex.string_bytes_len_lte)=32];
}
message UpdateRootPasswordResp{
}
message CreateProjectReq{
	string project_name=1[(pbex.string_bytes_len_not_eq)=0];
	string project_data=2;
}
message CreateProjectResp{
	repeated uint32 project_id=1;
}
message UpdateProjectReq{
	repeated uint32 project_id=1[(pbex.map_repeated_len_eq)=2];
	string new_project_name=2[(pbex.string_bytes_len_not_eq)=0];//if didn't change,set this with the old value
	string new_project_data=3;//if didn't change,set this with the old value
}
message UpdateProjectResp{
}
message ProjectInfo{
	repeated uint32 project_id=1;
	string project_name=2;
	string project_data=3;
}
message ListProjectReq{
}
message ListProjectResp{
	repeated ProjectInfo projects=1;
}
message DeleteProjectReq{
	repeated uint32 project_id=1[(pbex.map_repeated_len_eq)=2];
}
message DeleteProjectResp{
}
